services:
  api:
    build: .
    container_name: docintel_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/code              # ← changed from "./app:/code/app"
      - hf_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mysql:
    image: mysql:8.0
    container_name: docintel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: docintel
      MYSQL_USER: docintel
      MYSQL_PASSWORD: docintel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docintel_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: docintel_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: docintel
      MINIO_ROOT_PASSWORD: docintel123
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  qdrant_storage:
  minio_data:
  hf_cache: